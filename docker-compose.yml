services:
  postgres:
    image: postgres:16-alpine
    container_name: veltro-postgres
    environment:
      POSTGRES_DB: veltro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veltro-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev-with-ai
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/veltro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: dev-secret-key-minimum-32-chars-long
      GEMINI_API_KEY: ${GEMINI_API_KEY:-dev-gemini-key}
      SERVER_PORT: 8080
    depends_on:
      - postgres

volumes:
  pgdata:
