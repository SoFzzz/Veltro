spring:
  application:
    name: veltro
  config:
    import: optional:file:./.env[.properties]
  profiles:
    # Keep a single active profile to avoid merge-conflict artifacts.
    active: dev-with-ai
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# JWT configuration (B1-02).
# Override jwt.secret per environment profile; never commit a real secret here.
jwt:
  secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-min-256bits!!}
  access-token-expiration: 3600       # 1 hour in seconds
  refresh-token-expiration: 604800    # 7 days in seconds

# AI Vision API configuration (B3-01).
# Supports: OpenRouter, OpenAI, Google Gemini, etc.
# API provider is auto-detected based on key format:
#   - sk-or-... = OpenRouter
#   - AIza... = Google Gemini
#   - sk-... = OpenAI
# For production, configure via environment variables
veltro:
  ai:
    openai:
      enabled: true                               # AI vision enabled
      api-key: ${GEMINI_API_KEY}
      model: "gemini-2.5-flash"
      max-tokens: 2000
      timeout-seconds: 30
      max-image-size-mb: 10
      max-retries: 3


    clip:
      enabled: true
      model-path: "models/clip-image-vit-32.onnx"
      model-checksum: ""
      version: "ViT-B/32-v1"

app:
  uploads-dir: ${UPLOADS_DIR:./uploads}
