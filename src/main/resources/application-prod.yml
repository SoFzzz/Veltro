spring:
  datasource:
    url: ${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL:${DB_URL}}}
    username: ${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}}
    password: ${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

veltro:
  ai:
    openai:
      enabled: ${AI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:${OPENAI_API_KEY:}}
      model: ${OPENAI_MODEL:gemini-2.5-flash}
      max-tokens: 2000
      timeout-seconds: 30
      max-image-size-mb: 10
      max-retries: 3

app:
  uploads-dir: ${UPLOADS_DIR:./uploads}
