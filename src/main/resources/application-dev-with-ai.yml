spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:veltro}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.veltro: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.flywaydb: DEBUG

server:
  port: 8080

# AI Vision API configuration - ENABLED FOR TESTING
veltro:
  ai:
    openai:
      enabled: true
      # Using a mock/test key for demonstration - replace with real key to test actual API
      api-key: ${GEMINI_API_KEY}
      model: "gemini-2.5-flash"
      max-tokens: 2000
      timeout-seconds: 30
      max-image-size-mb: 10
      max-retries: 3  # Reduced for testing to avoid delays